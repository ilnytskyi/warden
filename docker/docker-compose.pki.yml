services:
  pki:
    container_name: pki
    image: nginx:alpine
    volumes:
      - ${WARDEN_HOME_DIR}/etc/pki-public:/usr/share/nginx/html:ro
      - ${WARDEN_SERVICE_DIR}/docker/pki/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.pki.rule=PathPrefix(`/.warden/pki/`)
      - traefik.http.routers.pki.entrypoints=http
      - traefik.http.routers.pki.priority=1000
      - traefik.http.routers.pki.service=pki
      - traefik.http.routers.pki.middlewares=pki-strip-prefix
      - traefik.http.middlewares.pki-strip-prefix.stripprefix.prefixes=/.warden/pki
      - traefik.http.services.pki.loadbalancer.server.port=80
    restart: ${WARDEN_RESTART_POLICY:-always}
